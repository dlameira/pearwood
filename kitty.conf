# Terminal só do pearwood (kitty, para a fonte mudar sozinha: 9 no início, 12 nas notas).
include ~/.local/state/omarchy/current/theme/kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        9
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
shell_integration disabled

# o Neovim pede a troca de fonte por aqui
allow_remote_control socket-only
listen_on unix:@pearwood-kitty-{kitty_pid}

# sem atalhos do kitty roubando teclas do Cofre; só copiar/colar (Super + C/V do Omarchy)
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
